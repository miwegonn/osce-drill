<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1016">
<title>OSCE MED Y4 — ทวน 5 ชั่วโมง</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<style>
:root{--bg:#0d1016;--pnl:#161a23;--pnl2:#1d222e;--ln:#2b3242;--tx:#e7eaf0;--dim:#959db0;
--acc:#5eb3ff;--warn:#ffb454;--bad:#ff7b72;--good:#7ee787;--gold:#f5c451}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Sarabun,sans-serif;
-webkit-text-size-adjust:100%;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:800px;margin:0 auto;padding:14px 14px 100px}
h1{font-size:21px;margin:8px 0 2px;text-align:center}
.sub{color:var(--dim);font-size:13px;text-align:center;margin-bottom:12px}
.panel{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:13px 15px;margin:12px 0}
.panel.now{border-color:var(--gold);box-shadow:0 0 0 1px rgba(245,196,81,.35)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mode{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:11px 10px;text-align:left;color:var(--tx);
font-family:inherit;cursor:pointer;display:block}
.mode:hover{border-color:var(--acc)}
.mode b{display:block;font-size:14.5px;margin:2px 0 0}
.mode span{color:var(--dim);font-size:12px}
.mode .ic{font-size:20px}
.bh{display:flex;align-items:baseline;gap:8px}
.bh b{flex:1;font-size:15px}
.tm{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap}
.bp{font-size:12px;color:var(--dim);white-space:nowrap}
.bd{font-size:12.5px;color:var(--dim);margin:2px 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--ln);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover .tx{color:var(--acc)}
.row .tx{flex:1;min-width:0;font-size:14px}
.row .tx small{color:var(--dim);display:block;font-size:12px}
.ch{flex:0 0 auto;min-width:46px;text-align:center;font-size:12px;font-weight:700;border-radius:8px;padding:3px 6px}
.ch.hot{background:#3b2a10;color:var(--gold)} .ch.mid{background:#2a2235;color:#d2a8ff} .ch.low{background:var(--pnl2);color:var(--dim)}
.stt{flex:0 0 auto;font-size:12.5px;font-weight:700;min-width:44px;text-align:right}
.stt.ok{color:var(--good)} .stt.part{color:var(--warn)} .stt.seen{color:var(--acc)} .stt.no{color:#4b5468}
.bar{height:8px;background:var(--pnl2);border-radius:6px;overflow:hidden;margin:6px 0 2px;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .r{background:var(--bad)}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.btn{display:block;width:100%;background:var(--acc);color:#07131f;border:0;border-radius:12px;padding:12px;font-size:15px;
font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;text-align:center}
.btn.ghost{background:var(--pnl2);color:var(--tx);border:1px solid var(--ln);font-weight:500}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13.5px;margin:4px 6px 0 0}
.chip{background:var(--pnl2);color:var(--dim);border:1px solid var(--ln);border-radius:16px;padding:6px 12px;
font-size:12.5px;cursor:pointer;font-family:inherit;margin:3px 4px 3px 0}
.chip.on{background:#13304a;border-color:var(--acc);color:var(--acc)}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.top h2{font-size:16px;margin:0;flex:1;line-height:1.35}
.back{background:none;border:1px solid var(--ln);color:var(--dim);border-radius:10px;padding:6px 11px;cursor:pointer;font-family:inherit;font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{flex:1;min-width:90px;text-align:center;background:var(--pnl);border:1px solid var(--ln);border-radius:10px;padding:8px 6px;font-size:13.5px;cursor:pointer;color:var(--dim);font-family:inherit}
.tab.on{border-color:var(--acc);color:var(--acc);background:#13304a}
.tab.tmr{flex:0 0 auto;min-width:0;color:var(--gold)}
.script{background:#121c28;border:1px solid #2c6183;border-radius:12px;padding:10px 13px;font-size:14px;margin-bottom:12px}
.script .lab{color:var(--acc);font-size:12px;font-weight:700;display:block;margin-bottom:2px}
.sec{margin:14px 0 4px;font-size:14px;color:var(--gold);font-weight:700}
ol.it{margin:0;padding-left:0;list-style:none;counter-reset:n}
ol.it li{counter-increment:n;position:relative;padding:6px 8px 6px 34px;border-bottom:1px solid var(--ln);font-size:14px}
ol.it li:before{content:counter(n);position:absolute;left:4px;top:7px;width:22px;height:22px;border-radius:7px;background:var(--pnl2);
color:var(--dim);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.it li.miss{background:rgba(255,123,114,.07)} ol.it li.miss:before{background:#4a1f1c;color:var(--bad)}
ol.it li.hit:before{background:#16321f;color:var(--good)}
.cue{color:var(--acc);font-weight:700}
.traps{background:#241b0e;border:1px solid #6b4b16;border-radius:12px;padding:10px 13px;margin:14px 0;font-size:13.5px}
.traps .lab{color:var(--warn);font-weight:700;font-size:12.5px;display:block;margin-bottom:2px}
.traps ul{margin:0;padding-left:18px}
.qa{margin:6px 0}
.qa div{padding:8px 2px;border-bottom:1px solid var(--ln);font-size:14px}
.qa b.q{display:block;color:#c9d6ea}
.qa span{color:var(--tx)}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin:2px 0 10px}
.dots i{width:12px;height:6px;border-radius:3px;background:var(--pnl2)}
.dots i.g{background:var(--good)} .dots i.r{background:var(--bad)} .dots i.cur{background:var(--acc)}
.prevs{font-size:12.5px;color:var(--dim);margin:0 0 8px;padding-left:10px;border-left:2px solid var(--ln)}
.prevs div{margin:2px 0}
.card{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:8px 0}
.deck{font-size:12px;color:var(--dim);margin-bottom:4px}
.qbig{font-size:17px;font-weight:700;margin:2px 0 10px;line-height:1.5}
.hid{border:1px dashed var(--ln);border-radius:12px;padding:16px;text-align:center;color:var(--dim);font-size:14px;cursor:pointer}
.ans{background:#16211a;border:1px solid #2e6b3f;border-radius:12px;padding:12px 14px;font-size:15px;margin-top:10px}
.ans b{color:#c9f5cc}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grade button{border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--pnl2)}
.grade .no{border:1px solid rgba(255,123,114,.6);color:#ffb3ad}
.grade .ok{border:1px solid rgba(126,231,135,.6);color:#b9f5be}
.keys{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}
.sum{text-align:center}
.sum .big{font-size:42px;font-weight:800;margin:4px 0}
.miss-list{text-align:left;font-size:13.5px;margin-top:8px}
.miss-list div{padding:6px 0;border-bottom:1px solid var(--ln)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td{border-bottom:1px solid var(--ln);padding:8px 6px;vertical-align:top}
td:first-child{color:var(--acc);font-weight:600;width:30%}
.tick{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--ln);cursor:pointer;font-size:14px}
.tick .bx{flex:0 0 22px;height:22px;border-radius:6px;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:13px}
.tick.on .bx{background:#16321f;border-color:#2e6b3f;color:var(--good)}
.tick.on .tt{color:var(--dim)}
.tick b{color:var(--warn)}
input.search{width:100%;background:var(--pnl);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px 13px;font:inherit;font-size:14px}
input.search:focus{outline:none;border-color:var(--acc)}
.small{font-size:12.5px;color:var(--dim)}
.reset{background:none;border:0;color:var(--dim);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:12.5px;margin-top:8px}
.clockbig{font-size:26px;font-weight:800;color:var(--gold)}
.next{display:block;text-align:right;color:var(--acc);font-size:14px;margin-top:14px}
#tpill{position:fixed;right:14px;bottom:14px;background:#13304a;border:1px solid var(--acc);color:var(--acc);border-radius:22px;
padding:9px 16px;font-weight:800;font-size:17px;cursor:pointer;display:none;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#tpill.warn{background:#3b2a10;border-color:var(--warn);color:var(--warn)}
#tpill.over{background:#4a1f1c;border-color:var(--bad);color:var(--bad)}
#tpill small{font-size:11px;font-weight:500;opacity:.8;margin-left:6px}
@media(max-width:560px){.modes{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="tpill" title="แตะเพื่อหยุด"></div>
<script>
var S=[];
/* ===== หัตถการ / ฐานคงที่ ===== */
S.push({id:"cpr",cat:"proc",t:"CPR (BLS ผู้ใหญ่)",ch:95,fq:"11/11",
sc:"ตบไหล่ 2 ข้าง “คุณคะ ๆ ได้ยินไหมคะ” → “ช่วยด้วยค่ะ มีคนหมดสติ! ช่วยโทร 1669 / เรียกทีม CPR และขอ AED ด้วยค่ะ”",
st:[
["ประเมิน",[
"Scene safe::ดูความปลอดภัยของที่เกิดเหตุ (scene safety) ก่อนเข้าไป",
"เรียก::ตบไหล่ 2 ข้าง เรียก “คุณคะ ๆ” → ไม่ตอบสนอง",
"ขอความช่วยเหลือ::ตะโกนขอความช่วยเหลือ · โทร 1669 / เรียกทีม CPR + ขอ AED · บอกสถานที่ สถานการณ์ จำนวนผู้ป่วย",
"ประเมิน::ดูการหายใจ + คลำ carotid pulse พร้อมกัน <b>≤ 10 วินาที</b>"]],
["กดหน้าอก",[
"ตัดสินใจ::ไม่หายใจ / no definite pulse → assume cardiac arrest → เริ่ม chest compression ทันที",
"ตำแหน่ง::กึ่งกลางหน้าอก ครึ่งล่างของ sternum · แขนเหยียดตึง ไหล่ตั้งฉากกับมือ",
"คุณภาพ::Push hard <b>≥ 5 cm (2 นิ้ว)</b> · push fast <b>100–120/min</b> · full recoil · หยุดกด ≤ 10 วินาที · avoid excessive ventilation"]],
["ช่วยหายใจ",[
"อัตราส่วน::<b>30 : 2</b> · เปิด airway ด้วย head tilt–chin lift (สงสัย C-spine → jaw thrust)",
"Ambu::Ambu bag ต่อ O₂ 10–12 L/min · บีบให้อกยก ครั้งละ ~1 วินาที"]],
["รอบ + AED",[
"ทุก 2 นาที::ทุก 5 cycles (~2 นาที) → คลำ pulse / ดู rhythm + เปลี่ยนคนกด",
"AED::AED มาถึง → เปิดเครื่อง ติด pad ทำตามเสียงสั่ง · ทุกคนถอยตอน shock แล้วกดต่อทันที"]]
],
qa:[
["อัตรากด / ความลึก / การคืนตัว","100–120 ครั้ง/นาที · ≥ 5 cm (2 นิ้ว) · full recoil"],
["อัตราส่วนกด : ช่วยหายใจ","30 : 2"],
["คลำ pulse ตรงไหน นานสุดกี่วินาที","Carotid pulse · ไม่เกิน 10 วินาที (ดูการหายใจไปพร้อมกัน)"],
["เปลี่ยนคนกด / เช็ค pulse เมื่อไร","ทุก 5 cycles ≈ 2 นาที"],
["คลำได้ pulse ชัดเจน แต่ไม่หายใจ ทำอย่างไร","ไม่กดหน้าอก → ช่วยหายใจอย่างเดียว ~1 ครั้งทุก 6 วินาที (10/min) แล้ว recheck pulse ทุก 2 นาที"],
["สงสัยบาดเจ็บกระดูกคอ เปิดทางเดินหายใจท่าไหน","Jaw thrust (ไม่ใช้ head tilt–chin lift)"]],
tr:["48/3: carotid <b>มี pulse จริง</b> → ต้องคลำให้จริงแล้วตัดสินใจตาม (ไม่กดหน้าอก)","46/1: ไม่มีผู้ช่วย AED ไม่มาสักที ต้องปั๊มคนเดียวยาว ๆ → คุมความลึก/อัตราให้คงที่","46/3: ครบ 5 cycles มี ambu ให้ · 50/3: ฉาก “หน้า OR” ต้องสั่งผู้ช่วย “บีบ 2 ที แล้วกด 30 ที”","ปั๊มให้ลึกจริง ๆ ≥ 5 cm"]});

S.push({id:"hand",cat:"proc",t:"ล้างมือ 7 ขั้นตอน + 5 moments",ch:95,fq:"11/11",
sc:"ถอดนาฬิกา/แหวนก่อน · กดน้ำยา alcohol hand rub (50/3: กด 2 ปั๊ม) ให้ทั่วฝ่ามือ แล้วถูจนมือแห้งพอดี",
st:[
["7 ขั้น (alcohol rub รวม ~20–30 วินาที)",[
"ขั้น 1::ฝ่ามือถูฝ่ามือ",
"ขั้น 2::ฝ่ามือถูหลังมือ + ซอกนิ้ว (สลับข้าง)",
"ขั้น 3::ฝ่ามือถูฝ่ามือ นิ้วสอดประสาน ถูซอกนิ้ว",
"ขั้น 4::หลังนิ้วมือถูฝ่ามืออีกข้าง (นิ้วเกี่ยวกัน)",
"ขั้น 5::ถูนิ้วหัวแม่มือโดยรอบด้วยฝ่ามืออีกข้าง (สลับข้าง)",
"ขั้น 6::ปลายนิ้ว/เล็บ ถูวนบนฝ่ามืออีกข้าง (สลับข้าง)",
"ขั้น 7::ถูรอบข้อมือ (สลับข้าง)"]],
["5 moments (WHO)",[
"1::ก่อนสัมผัสผู้ป่วย",
"2::ก่อนทำหัตถการสะอาด / ปราศจากเชื้อ",
"3::หลังสัมผัสสารคัดหลั่ง (เสี่ยงสัมผัสเลือด/สารน้ำ)",
"4::หลังสัมผัสผู้ป่วย",
"5::หลังสัมผัสสิ่งแวดล้อมรอบตัวผู้ป่วย"]]
],
qa:[
["ใช้เวลาเท่าไร","Alcohol rub รวม ~20–30 วินาที (ไม่ใช่ท่าละ 20 วินาที) · ล้างน้ำ+สบู่ ~40–60 วินาที"],
["จุดที่พลาดบ่อย (ส่อง UV)","ปลายนิ้ว/ซอกเล็บ · ซอกนิ้ว · นิ้วโป้ง · ข้อมือ · หลังมือ"]],
tr:["ถอดนาฬิกา/เครื่องประดับก่อนเสมอ (46/1)","46/3 ใช้น้ำยาฟลูออเรสเซนต์ + UV ตรวจว่าล้างทั่วไหม → ถูเล็บ ซอกนิ้ว ข้อมือให้มาก","50/3 ถาม 5 moments ต่อท้าย"]});

S.push({id:"ortho",cat:"proc",t:"Orthostatic hypotension (+ volume status)",ch:95,fq:"11/11",
sc:"“วันนี้จะมาวัดความดันในท่านอนและท่ายืน เพื่อดูว่าความดันตกเวลาเปลี่ยนท่าไหม ระหว่างวัดขอให้ไม่เกร็ง ไม่พูดคุยนะคะ”",
st:[
["เตรียม",[
"เปิด::ล้างมือ แนะนำตัว ยืนยันชื่อ-สกุล อธิบาย ขออนุญาต",
"ถาม::ไม่ได้ดื่มชา/กาแฟ/สูบบุหรี่ใน 30 นาที · ห้องเงียบ ไม่เกร็ง ไม่พูดคุย",
"Cuff::cuff กว้าง ≈ 40% ของรอบแขน · ขอบล่างเหนือข้อพับ 2–3 cm · กึ่งกลาง bladder ทับ brachial artery · แขนระดับหัวใจ",
"พัก::นอนราบพัก <b>5 นาที</b> (พูดว่า “พักครบ 5 นาทีแล้ว” แล้วทำต่อได้)"]],
["วัด",[
"ท่านอน::คลำ radial → ปั๊มจน pulse หาย แล้วเกินอีก 20–30 mmHg → ปล่อย ~2 mmHg/วินาที → อ่าน SBP/DBP + <b>จับ pulse</b>",
"เปลี่ยนท่า::ให้ลุกยืน (ยืนไม่ไหว → นั่งห้อยขา) ระวังล้ม",
"ท่ายืน::วัด BP + pulse ที่ <b>1 นาที และ 3 นาที</b> หลังยืน",
"อาการ::ถามหน้ามืด เวียนหัว ใจสั่น ขณะยืน"]],
["แปลผล",[
"เกณฑ์::เทียบกับท่านอน: <b>SBP ↓ ≥ 20</b> หรือ <b>DBP ↓ ≥ 10 mmHg</b> (โพย “20-10-15”: pulse ↑ ≥ 15–20/min; บางตำรา ≥ 30) → orthostatic hypotension",
"สาเหตุ::volume depletion (ท้องเสีย อาเจียน เสียเลือด) · ยา (diuretic, α-blocker) · autonomic dysfunction (DM, Parkinson)"]],
["Volume status (ถ้าถาม)",[
"ดู::drowsy, ซีด, sunken eyeball, dry lips/mouth",
"คลำ/วัด::skin turgor, capillary refill, pulse เบาเร็ว, JVP, BP, RR (tachypnea), pitting edema"]]
],
qa:[
["เกณฑ์ orthostatic hypotension","SBP ลด ≥ 20 หรือ DBP ลด ≥ 10 mmHg (pulse เพิ่ม ≥ 15–20 ตามโพย) เมื่อเทียบท่านอน"],
["ลำดับเวลา","นอนพัก 5 นาที → วัดท่านอน → ยืน → วัดที่ 1 และ 3 นาที"],
["ปั๊ม cuff สูงแค่ไหน ปล่อยเร็วเท่าไร","เกินจุดที่คลำ radial หายอีก 20–30 mmHg · ปล่อย ~2 mmHg/วินาที"],
["ขนาด cuff","bladder กว้าง ≈ 40% ของรอบแขน (ยาว ≈ 80%)"]],

S.push({id:"rehab",cat:"proc",t:"Rehab: จัดท่านอน ป้องกันแผลกดทับ/ข้อติด",ch:92,fq:"10/11",

S.push({id:"mi",cat:"adv",t:"Advice post-MI / PCI",ch:18,fq:"5/11 (กอง 1 ทั้งหมด)",
sc:"“คุณหมอคนก่อนบอกแล้วหรือยังคะว่าเป็นโรคอะไร · เข้าใจเกี่ยวกับโรคกล้ามเนื้อหัวใจขาดเลือดอย่างไรบ้าง · วันนี้จะมาแนะนำการดูแลตัวเองหลังจากนี้นะคะ”",
st:[
["อธิบายโรค",[
"กลไก::ไขมันสะสมในผนังหลอดเลือด → เลือดเลี้ยงกล้ามเนื้อหัวใจไม่พอ → กล้ามเนื้อหัวใจตายบางส่วน → แทรกซ้อน HF, arrhythmia",
"เสี่ยง/เป้าหมาย::ปัจจัยเสี่ยง DM HT ไขมัน บุหรี่ · กลับเป็นซ้ำได้ · เป้า: ป้องกันเป็นซ้ำ ป้องกันเสียชีวิตเฉียบพลัน บรรเทาอาการ"]],
["ปรับพฤติกรรม",[
"อาหาร::ลดของทอด/มัน/คอเลสเตอรอลสูง (เนื้อติดมัน ไข่แดง อาหารทะเล) · กินผัก ผลไม้ ปลา ไก่ น้ำมันมะกอก · ลดเค็ม",
"บุหรี่ / สุรา / น้ำหนัก::งดบุหรี่เด็ดขาด · งดสุรา · คุมน้ำหนัก (BMI 26 → < 23)",
"ออกกำลัง::aerobic ปานกลาง ~150 นาที/สัปดาห์ (ยังพูดเป็นประโยคได้) · cardiac rehab · ช่วงแรกอย่ายกของหนัก",
"เลี่ยง trigger::ออกแรงหลังมื้อใหญ่ อากาศเย็น ความเครียด"]],
["เป้าหมายปัจจัยเสี่ยง",[
"LDL::< 70 mg/dL (statin + อาหาร)",
"BP::< 140/90 mmHg (ACEI/ARB + ลดเค็ม)",
"DM::HbA1c < 6.5%"]],
["ยา (ตอบ “ทำไมยาเยอะ”)",[
"Antiplatelet::aspirin + clopidogrel: กันลิ่มเลือดอุดซ้ำ/อุดขดลวด · ห้ามหยุดเอง · เลือดออกง่ายขึ้น",
"Beta-blocker::metoprolol: ลดงานหัวใจ ลด arrhythmia · ระวังชีพจรช้า เวียนหัว เหนื่อย",
"Statin::ลด LDL ทำให้ plaque เสถียร · ระวังปวดกล้ามเนื้อ ตับ",
"NTG::ยาอมใต้ลิ้น พกติดตัวเสมอ · <b>อย่าซื้อยากินเอง (เช่น viagra)</b>"]],
["Red flag + ปิด",[
"Red flag::แน่นอกเหมือนของหนักทับ ร้าวกราม/แขน เหงื่อแตก → อม NTG 1 เม็ด ถ้า 5 นาทีไม่ดีขึ้น โทร 1669 / มา รพ. ทันที (อมซ้ำได้ทุก 5 นาที สูงสุด 3 เม็ด)",
"ปิด::กินยาสม่ำเสมอ มาตามนัด · “มีอะไรสงสัยเพิ่มไหมคะ”"]]
],
qa:[
["“พรุ่งนี้ถอนฟัน / ผ่าตัดได้ไหม”","ห้ามหยุดยาต้านเกล็ดเลือดเอง · ไม่เร่งด่วนให้เลื่อนก่อน (หลังใส่ stent ~6 เดือน–1 ปี) · ถ้าจำเป็น แจ้งทันตแพทย์/ศัลยแพทย์ให้ปรึกษาหมอหัวใจ"],
["“มีเพศสัมพันธ์ได้ไหม”","ไม่ใช่ข้อห้าม ถ้าอาการคงที่ กินยาสม่ำเสมอ (ขึ้นบันได 2 ชั้นไม่เจ็บอก) · ช่วง ~2 สัปดาห์แรกงดก่อน · เลี่ยงหลังมื้อหนัก · <b>ห้ามใช้ sildenafil ร่วม nitrate</b> → BP ตกฮวบ"],
["“แปรงฟันแล้วเลือดออก”","ผลข้างเคียงยาต้านเกล็ดเลือด ห้ามหยุดเอง · ถ้าถ่ายดำ อาเจียนเป็นเลือด ปัสสาวะเป็นเลือด → มา รพ. ทันที"],
["“ปวดเมื่อยจากยาลดไขมัน / กินสมุนไพรล้างหลอดเลือดแทนได้ไหม”","ไม่แนะนำให้ใช้แทน · ปวดกล้ามเนื้อให้มาพบแพทย์ปรับยา ไม่หยุดเอง"],
["“ไม่เจ็บแล้ว ต้องกินยาตลอดชีวิตเลยเหรอ”","ยาต้านเกล็ดเลือดตัวที่ 2 กินครบตามที่หมอสั่ง (~1 ปี) · aspirin + statin กินต่อเนื่อง · อย่าหยุดเอง"]],
tr:["ข้อท้ายเช็คลิสต์คือคำถามเรื่องเพศสัมพันธ์","อย่าลืม “อย่าซื้อยากินเอง (viagra)” + red flag"]});

S.push({id:"ng",cat:"adv",t:"Consent NG tube (gastric lavage)",ch:18,fq:"5/11 (กอง 1)",
sc:"“ผู้ป่วยอาเจียนเป็นเลือด วันนี้จะใส่สายยางทางจมูกลงไปที่กระเพาะ เพื่อดูว่ายังมีเลือดออกอยู่ไหม และล้างเลือดออก (gastric lavage) นะคะ”",
st:[
["อธิบาย",[
"ทำไม::อาเจียนเป็นเลือด → ใส่สายเพื่อดู active bleeding + ล้างกระเพาะ",
"ทำอย่างไร::ใส่สายทางจมูก ผ่านหลอดอาหารลงกระเพาะ ให้ผู้ป่วยช่วยกลืนตามสาย",
"รู้สึกอย่างไร::แสบ/เจ็บจมูก คอ คลื่นไส้ น้ำตาไหล (ชั่วคราว)",
"นานแค่ไหน::ตามจุดประสงค์ (จนน้ำล้างใส) · แนะนำไม่เกิน ~1 เดือนต่อสาย"]],
["ถามข้อห้าม",[
"จมูก / หน้า::คัดจมูกมาก · เคยผ่าตัด/อุบัติเหตุจมูก ใบหน้า ศีรษะ",
"หลอดอาหาร::กลืนลำบาก/กลืนติด · หลอดอาหารตีบ/อักเสบ/เคยผ่าตัด",
"เลือดออก::เลือดออกง่าย · ยาต้านเกล็ดเลือด/ยาต้านการแข็งตัวของเลือด",
"อื่น (โพย)::HIV ที่คุมไม่ได้ · อาเจียนเรื้อรังไม่ตอบสนองยา"]],
["ภาวะแทรกซ้อน",[
"เฉพาะที่::เลือดออก/บาดเจ็บจมูก คอหอย · บาดเจ็บกล่องเสียง",
"ทางเดินอาหาร::แผล ติดเชื้อ หรือทะลุ หลอดอาหาร/กระเพาะ",
"ใส่นาน::แผลกดทับที่จมูก · ไซนัสอักเสบ · หูชั้นกลางอักเสบ",
"ปอด::สำลัก → aspiration pneumonia · สายเข้าหลอดลม"]],
["ปิด",[
"Consent::ถามความเข้าใจ/ความกังวล · เปิดให้ถาม · ขอความยินยอม (ลงชื่อ)"]]
],
qa:[
["“ไม่ใส่ได้ไหม”","มีสิทธิ์ปฏิเสธ แต่ต้องบอกผล: ไม่รู้ว่ายังเลือดออกไหม ล้างเลือดไม่ได้ อาจต้องวิธีอื่น (ส่องกล้อง) · ถามว่ากังวลเรื่องอะไร"],
["“ต้องใส่นานแค่ไหน”","จนเลือดหยุด/น้ำล้างใส แล้วแพทย์ประเมินถอด · ไม่เกิน ~1 เดือนต่อสาย"],
["“เจ็บไหม ใส่ยากไหม”","แสบชั่วคราว ถ้าช่วยกลืนตามสายจะใส่ง่ายขึ้น"]],
tr:["บอกภาวะแทรกซ้อนให้ครบ (คะแนนอยู่ตรงนี้)","ถามข้อห้ามก่อนใส่ทุกครั้ง"]});

S.push({id:"ngf",cat:"adv",t:"สอนญาติให้อาหารทางสายยาง (NG feeding)",ch:15,fq:"คู่กับ NG",
sc:"“วันนี้จะมาแนะนำการให้อาหารทางสายยางทางจมูกลงกระเพาะ เพื่อให้ผู้ป่วยได้รับอาหารเมื่อกินทางปากไม่ได้ · ท่านเป็นผู้ดูแลหลักใช่ไหมคะ เคยช่วยพยาบาลป้อนมาก่อนไหมคะ”",
st:[
["ก่อนให้",[
"เตรียม::ล้างมือ · จัดท่านอนหัวสูง <b>30–45°</b> หรือนั่ง",
"เช็คสาย::ดูขีดความยาวที่จมูกไม่เลื่อน · ดูดสิ่งค้างในกระเพาะ (residual) ออกมาดู",
"Residual::<b>< 50 mL</b> → ดันกลับเข้าไป แล้วให้อาหารได้ · มากกว่า → เลื่อนมื้อออก ~1 ชม. แล้วตรวจใหม่"]],
["ระหว่างให้",[
"ต่อสาย::พับ/หนีบสายก่อนต่อ syringe กันลมเข้า",
"ความสูง::ถุง/กระบอกอาหารสูงจากตัวผู้ป่วย <b>~30 cm</b> · ไหลช้า ๆ ตามแรงโน้มถ่วง ไม่ดัน · อาหารอุ่นเล็กน้อย"]],
["หลังให้",[
"Flush::flush ด้วยน้ำต้มสุก ~20–30 mL · ปิดจุก พับเก็บ",
"ท่า::นั่ง/หัวสูงต่อ <b>30–60 นาที</b> ห้ามนอนราบทันที",
"ดูแล::ทำความสะอาดปาก-จมูกทุกวัน · ติดเทปยึดแน่น เปลี่ยนตำแหน่งเทป",
"ให้ยา::บดละเอียดทีละตัว ละลายน้ำต้มสุก ป้อนแยก flush ตาม ไม่ผสมในอาหาร"]],
["Red flag → มา รพ.",[
"Red flag::สำลัก ไอ หอบ ตัวเขียว · สายหลุด · ท้องอืดมาก อาเจียน · residual เป็นอาหารไม่ย่อย/สีเขียว-น้ำตาลเข้มตลอด"]]
],
qa:[
["“ดูดแล้วอาหารค้างเยอะ เททิ้งเลยได้ไหม”","ห้ามทิ้ง ดันกลับเข้าไป (มีน้ำย่อย เกลือแร่) แล้วรอ ~1 ชม. ค่อยตรวจใหม่"],
["“กำลังป้อน ไอแรง หน้าแดง หายใจครืดคราด”","หยุดป้อนทันที จับตะแคง ดูดเศษอาหาร/เสมหะ · หายใจไม่ออก โทร 1669"],
["“สายเลื่อนหลุด ดันกลับเองได้ไหม”","ห้าม อาจเข้าหลอดลม · ติดเทปไว้แล้วพามา รพ."],
["“บดยารวมกันเทผสมนมได้ไหม”","ไม่แนะนำ ตกตะกอน สายตัน ดูดซึมไม่ดี → บดทีละตัว ป้อนแยก flush ตาม"]],
tr:["ตัวเลขต้องจำ: หัวสูง 30–45° · residual < 50 mL · สูง 30 cm · นั่งต่อ 30–60 นาที"]});

S.push({id:"advo",cat:"adv",t:"Advice อื่น: epilepsy · TB · HT · ให้เลือด · CKD · LP",ch:8,fq:"โพยรุ่นพี่",
sc:"โครงเดียวกันทุก advice: แนะนำตัว → ถามความเข้าใจเดิม → อธิบายทีละหัวข้อด้วยภาษาง่าย → teach-back → red flag → เปิดให้ถาม",
st:[
["Epilepsy",[
"ยา::กินสม่ำเสมอ ไม่หยุดเอง · เลี่ยง trigger (อดนอน สุรา แสงกะพริบ)",
"ปฐมพยาบาล::ตั้งสติ จัดนอนตะแคง กันอุบัติเหตุ <b>ห้ามงัดปาก/ใส่ของในปาก</b> จับเวลา · ชัก > 5 นาที โทร 1669",
"ข้อห้าม::ว่ายน้ำคนเดียว ที่สูง เครื่องจักร · ขับรถเมื่อคุมชักได้ ≥ 1 ปี (โพย)",
"ผลข้างเคียงยา::phenytoin: เหงือกบวม ขนดก เดินเซ ง่วง SJS · valproate: มือสั่น น้ำหนักขึ้น ผมร่วง ตับ teratogenic · carbamazepine: SJS (HLA-B*1502), hyponatremia"]],
["TB",[
"สูตร::2HRZE/4HR (2+4 เดือน) กินครบ ตรงเวลา",
"ผลข้างเคียง::ผื่น · ตัวเหลือง (H, R, Z) · ชาปลายมือเท้า (H → ให้ B6) · ตามัว/ตาบอดสี (E) · ปัสสาวะสีส้ม (R ปกติ)",
"กันแพร่::ปิดปากเวลาไอ ใส่หน้ากาก แยกห้อง ~2 สัปดาห์แรก · ตรวจคัดกรองผู้สัมผัส"]],
["HT · CKD",[
"HT::เป้า < 140/90 · ลดเค็ม DASH ออกกำลัง ลดน้ำหนัก งดบุหรี่ สุรา · กินยาสม่ำเสมอ วัดความดันที่บ้าน",
"CKD::คุม BP/DM · เลี่ยง NSAIDs สมุนไพร · ลดเค็ม · โปรตีนพอดี · K/P ตามระยะ"]],
["ให้เลือด · LP",[
"ให้เลือด::ข้อบ่งชี้ ประโยชน์ ความเสี่ยง (ไข้ หนาวสั่น ผื่นแพ้ volume overload hemolytic reaction ติดเชื้อโอกาสต่ำมาก) · มีอาการผิดปกติระหว่างให้ บอกทันที",
"LP::เหตุผล · วิธีทำ (นอนตะแคงกอดเข่า เจาะ L3–4/L4–5) · แทรกซ้อน: ปวดหัวหลังเจาะ ติดเชื้อ เลือดออก ปวดหลัง"]]
],
qa:[
["ชักนานเท่าไรต้องโทร 1669","> 5 นาที (หรือชักซ้ำไม่ฟื้น)"],
["ยา TB ตัวไหนทำให้ปัสสาวะส้ม / ชาปลายมือเท้า / ตามัว","Rifampicin / Isoniazid (ให้ B6) / Ethambutol"]],
tr:["ฐานเหล่านี้ยังไม่พบในชุดที่รวบรวม อ่านผ่านหนึ่งรอบพอ"]});

{t:"ฐานคงที่ — หัตถการ",m:[0,45],d:"ออกทุกชุด เสียแต้มง่ายถ้าทำไม่ทัน ฝึกพูดตามจับเวลา 5 นาที",ids:["cpr","hand","ortho","rehab","dtx"]},
{t:"Lab — smear · Gram · CXR · EKG",m:[45,120],d:"8–9 ฐานจาก 20 (≈ 40% ของข้อสอบ) ออกครบทุกชุด",ids:["pbs","gram","cxr","ekg"]},
{t:"ซักประวัติ + รายงานเคส",m:[120,195],d:"กอง 2 เคยได้ chest pain/GERD + รายงานเคส · จิตเวชออกทุกชุด",ids:["hx0","cp","report","psy","mdd","ha","sz","ruq"]},

(function(){
var KEY='osceDrill.v1';
var CAT={proc:'หัตถการ',hx:'ซักประวัติ',adv:'Advice/Consent',pe:'ตรวจร่างกาย',lab:'Lab',num:'ตัวเลข'};
var P=load();
function load(){var x=null;try{x=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}if(!x||x.v!==1)x={v:1};
x.seen=x.seen||{};x.sp=x.sp||{};x.c=x.c||{};x.tr=x.tr||{};if(!('t0' in x))x.t0=null;return x;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}

/* ---- index ---- */
var SM={},ORDER=[],CARDS=[],CM={};
S.forEach(function(s){SM[s.id]=s;s.items=[];var k=0;
 s.st.forEach(function(sec){sec[1].forEach(function(it){var p=it.split('::');s.items.push({sec:sec[0],cue:p.length>1?p[0]:'',ans:p.length>1?p[1]:p[0],i:k++});});});
 s.qa.forEach(function(q,i){var c={id:s.id+':'+i,q:q[0],a:q[1],cat:s.cat,sid:s.id,deck:s.t};CARDS.push(c);CM[c.id]=c;});
 s.blob=strip([s.t,s.sc,s.fq].concat(s.items.map(function(x){return x.cue+' '+x.ans+' '+x.sec;}),s.qa.map(function(q){return q.join(' ');}),s.tr).join(' ')).toLowerCase();
});
NUMS.forEach(function(n,i){var c={id:'num:'+i,q:'ตัวเลข: '+n[0],a:n[1],cat:'num',sid:null,deck:'ตัวเลขต้องจำ'};CARDS.push(c);CM[c.id]=c;});
PLAN.forEach(function(b){b.ids.forEach(function(id){ORDER.push(id);});});
function strip(h){return String(h).replace(/<[^>]+>/g,'');}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function stStat(s){var m=P.sp[s.id]||{},g=0,ok=0;for(var i=0;i<s.items.length;i++){if(m[i]!==undefined){g++;if(m[i])ok++;}}return {n:s.items.length,g:g,ok:ok};}
function stLabel(s){var t=stStat(s);
 if(t.g===0)return P.seen[s.id]?'<span class="stt seen">อ่านแล้ว</span>':'<span class="stt no">—</span>';
 var pc=Math.round(100*t.ok/t.n);
 if(t.g===t.n&&pc>=80)return '<span class="stt ok">✓ '+pc+'%</span>';
 return '<span class="stt part">'+pc+'%</span>';}
function chCls(c){return c>=80?'hot':(c>=40?'mid':'low');}
function chBadge(s){return '<span class="ch '+chCls(s.ch)+'">'+(s.ch>=90?'≥90':'~'+s.ch)+'%</span>';}
function rowHtml(s){var t=stStat(s);return '<a class="row" href="#/s/'+s.id+'">'+chBadge(s)+'<span class="tx">'+esc(s.t)+'<small>'+CAT[s.cat]+' · ออก '+esc(s.fq)+' · '+t.n+' ข้อ · Q&amp;A '+s.qa.length+'</small></span>'+stLabel(s)+'</a>';}
function fmtM(m){var h=Math.floor(m/60),mm=m%60;return h+':'+(mm<10?'0':'')+mm;}
function passed(s){var t=stStat(s);return t.g===t.n&&t.ok/t.n>=0.8;}

/* ---- router ---- */
var app=document.getElementById('app');
function route(){var h=(location.hash||'').replace(/^#\/?/,'');return h.split('/');}
function go(h){if(location.hash==='#'+h)render();else location.hash=h;}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0);});

var R=null,D=null,DS={cat:'all',st:'all',sh:true};

function render(){var r=route();
 if(r[0]==='s'&&SM[r[1]]){var s=SM[r[1]];P.seen[s.id]=P.seen[s.id]||Date.now();save();
  if(r[2]==='recall')return vRecall(s);if(r[2]==='qa')return vQA(s);return vRead(s);}
 if(r[0]==='drill')return vDrill();
 if(r[0]==='traps')return vTraps();
 if(r[0]==='nums')return vNums();
 return vHome();}

/* ---- home ---- */
var sq='';
function vHome(){
 var nPass=0,nSeen=0;S.forEach(function(s){if(passed(s))nPass++;if(P.seen[s.id])nSeen++;});
 var cOk=0,cBad=0;CARDS.forEach(function(c){if(P.c[c.id]===1)cOk++;else if(P.c[c.id]===0)cBad++;});
 var trN=0;for(var k in P.tr)if(P.tr[k])trN++;
 var h='<h1>🩺 OSCE MED Y4 · ทวน 5 ชั่วโมง</h1><div class="sub">เก็ง MED51 กอง 2 · '+S.length+' ฐาน · อ่าน → Recall ลำดับ → Q&amp;A · ความคืบหน้าเก็บในเครื่องนี้</div>';
 h+='<div class="panel" id="clock"></div>';
 h+='<div class="modes">'+
  '<a class="mode" href="#/drill"><div class="ic">🃏</div><b>Quick drill</b><span>'+CARDS.length+' ใบ · ถูก '+cOk+'</span></a>'+
  '<a class="mode" href="#/drill" id="mWrong"><div class="ic">🎯</div><b>ข้อที่ผิด</b><span>'+cBad+' ใบ</span></a>'+
  '<a class="mode" href="#/traps"><div class="ic">⚠️</div><b>กับดัก</b><span>ติ๊กแล้ว '+trN+'/'+TRAPS.length+'</span></a>'+
  '<a class="mode" href="#/nums"><div class="ic">🔢</div><b>ตัวเลขต้องจำ</b><span>'+NUMS.length+' หัวข้อ</span></a></div>';
 h+='<div class="panel"><div class="stat"><span>Recall ผ่าน ≥ 80%</span><span>'+nPass+'/'+S.length+' ฐาน · เปิดอ่านแล้ว '+nSeen+'</span></div>'+
  '<div class="bar"><i class="g" style="width:'+(100*nPass/S.length)+'%"></i></div>'+
  '<div class="stat" style="margin-top:6px"><span>Q&amp;A ถูก / ผิด</span><span>'+cOk+' / '+cBad+' จาก '+CARDS.length+'</span></div>'+
  '<div class="bar"><i class="g" style="width:'+(100*cOk/CARDS.length)+'%"></i><i class="r" style="width:'+(100*cBad/CARDS.length)+'%"></i></div></div>';
 h+='<input class="search" id="q" placeholder="🔍 ค้นทุกฐาน เช่น Murphy, Sokolow, residual, ยาบ้า" value="'+esc(sq)+'">';
 h+='<div id="list"></div>';
 h+='<div class="panel small">ที่มา: สรุปเก็งข้อสอบของเพื่อน (11 ชุดข้อสอบเก่า) + โน้ตรุ่นพี่ · % = โอกาสออกที่เพื่อนประเมินจากแพทเทิร์น ไม่ใช่ข้อมูลทางการ · บางส่วนเติมจากความรู้ทั่วไป ให้ยึดตามที่อาจารย์สอน'+
  '<br><button class="reset" id="rst">ล้างความคืบหน้าทั้งหมด</button></div>';
 app.innerHTML=h;
 document.getElementById('mWrong').onclick=function(e){e.preventDefault();DS={cat:'all',st:'wrong',sh:true};D=null;go('/drill');};
 var q=document.getElementById('q');q.oninput=function(){sq=q.value;drawList();};
 document.getElementById('rst').onclick=function(){if(confirm('ล้างความคืบหน้าทั้งหมด (recall, Q&A, กับดัก, เวลา)?')){P={v:1,seen:{},sp:{},c:{},tr:{},t0:null};save();R=null;D=null;render();}};
 drawClock();drawList();}

function curBlock(){if(!P.t0)return -1;var e=(Date.now()-P.t0)/60000;for(var i=0;i<PLAN.length;i++)if(e>=PLAN[i].m[0]&&e<PLAN[i].m[1])return i;return e>=300?99:-1;}
function drawClock(){var el=document.getElementById('clock');if(!el)return;var h;
 if(!P.t0){h='<b>แผน 5 ชั่วโมง</b><div class="small">กดเริ่มเมื่อพร้อม ระบบจะไฮไลต์ช่วงที่ควรอ่านตามเวลาจริง (ต่อจากเดิมได้แม้ปิดหน้า)</div><button class="btn" id="t0">▶ เริ่มนับ 5 ชั่วโมง</button>';}
 else{var e=Math.floor((Date.now()-P.t0)/60000),rem=300-e,b=curBlock();
  h='<div class="stat"><span>'+(rem>0?'เหลือเวลา':'ครบ 5 ชั่วโมงแล้ว')+'</span><span>ผ่านไป '+fmtM(Math.max(0,e))+' ชม.</span></div>'+
   '<div class="clockbig">'+(rem>0?fmtM(rem)+' ชม.':'สู้ ๆ 💪')+'</div>'+
   (b>=0&&b<PLAN.length?'<div class="small">ตอนนี้ควรอยู่ช่วงที่ '+(b+1)+': <b style="color:var(--tx)">'+esc(PLAN[b].t)+'</b></div>':'')+
   '<div class="bar"><i class="g" style="width:'+Math.min(100,100*e/300)+'%"></i></div><button class="reset" id="t0r">รีเซ็ตเวลา</button>';}
 el.innerHTML=h;
 var a=document.getElementById('t0');if(a)a.onclick=function(){P.t0=Date.now();save();drawClock();drawList();};
 var b2=document.getElementById('t0r');if(b2)b2.onclick=function(){if(confirm('รีเซ็ตเวลา 5 ชั่วโมง?')){P.t0=null;save();drawClock();drawList();}};}

function drawList(){var el=document.getElementById('list');if(!el)return;var h='';
 var q=sq.trim().toLowerCase();
 if(q){var res=S.filter(function(s){return s.blob.indexOf(q)>=0;});
  h='<div class="panel"><div class="bh"><b>ผลค้นหา “'+esc(sq)+'”</b><span class="bp">'+res.length+' ฐาน</span></div>'+(res.length?res.map(rowHtml).join(''):'<div class="small">ไม่พบ</div>')+'</div>';
  el.innerHTML=h;return;}
 var cb=curBlock();
 PLAN.forEach(function(b,bi){var done=0;b.ids.forEach(function(id){if(passed(SM[id]))done++;});
  h+='<div class="panel'+(bi===cb?' now':'')+'"><div class="bh"><span class="tm">'+fmtM(b.m[0])+'–'+fmtM(b.m[1])+'</span><b>'+(bi+1)+'. '+esc(b.t)+'</b>'+(b.ids.length?'<span class="bp">'+done+'/'+b.ids.length+'</span>':'')+'</div>'+
   '<div class="bd">'+esc(b.d)+'</div>';
  b.ids.forEach(function(id){h+=rowHtml(SM[id]);});
  if(!b.ids.length)h+='<a class="btn sm" href="#/drill" id="bWrong">🎯 Drill ข้อที่ผิด</a><a class="btn sm ghost" href="#/traps">⚠️ กับดัก</a><a class="btn sm ghost" href="#/nums">🔢 ตัวเลข</a><a class="btn sm ghost" href="#/drill">🃏 สุ่มทั้งหมด</a>';
  h+='</div>';});
 el.innerHTML=h;
 var bw=document.getElementById('bWrong');if(bw)bw.onclick=function(e){e.preventDefault();DS={cat:'all',st:'wrong',sh:true};D=null;go('/drill');};}
setInterval(function(){if(route()[0]===''&&document.getElementById('clock')){drawClock();var q=document.getElementById('q');if(!q||!q.value)drawList();}},30000);

/* ---- station header ---- */
function head(s,tab){var t=stStat(s);
 return '<div class="top"><a class="back" href="#/">← หน้าแรก</a><h2>'+esc(s.t)+'</h2>'+chBadge(s)+'</div>'+
 '<div class="small">'+CAT[s.cat]+' · ออก '+esc(s.fq)+' · recall ล่าสุด '+t.ok+'/'+t.n+(t.g<t.n&&t.g>0?' (ทำไป '+t.g+')':'')+'</div>'+
 '<div class="tabs"><a class="tab'+(tab==='read'?' on':'')+'" href="#/s/'+s.id+'">📖 อ่าน</a>'+
 '<a class="tab'+(tab==='recall'?' on':'')+'" href="#/s/'+s.id+'/recall">🧠 Recall ('+t.n+')</a>'+
 '<a class="tab'+(tab==='qa'?' on':'')+'" href="#/s/'+s.id+'/qa">🃏 Q&amp;A ('+s.qa.length+')</a>'+
 '<button class="tab tmr" id="tmr">⏱ 5:00</button></div>';}
function bindHead(){var b=document.getElementById('tmr');if(b)b.onclick=startTimer;}

function vRead(s){var m=P.sp[s.id]||{};
 var h=head(s,'read');
 h+='<div class="script"><span class="lab">เปิดฐาน / โจทย์</span>'+s.sc+'</div>';
 var cur='';
 s.items.forEach(function(it){if(it.sec!==cur){if(cur)h+='</ol>';cur=it.sec;h+='<div class="sec">'+esc(it.sec)+'</div><ol class="it">';}
  var cl=m[it.i]===0?'miss':(m[it.i]===1?'hit':'');
  h+='<li class="'+cl+'">'+(it.cue?'<span class="cue">'+it.cue+'</span> — ':'')+it.ans+'</li>';});
 if(cur)h+='</ol>';
 if(s.tr&&s.tr.length)h+='<div class="traps"><span class="lab">⚠️ กับดัก / เพื่อนเตือน</span><ul>'+s.tr.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';
 if(s.qa.length){h+='<div class="sec">คำถามประจำฐาน / Q&amp;A</div><div class="qa">'+s.qa.map(function(q){return '<div><b class="q">'+q[0]+'</b><span>'+q[1]+'</span></div>';}).join('')+'</div>';}
 h+='<a class="btn" href="#/s/'+s.id+'/recall">🧠 ปิดแล้ว Recall ลำดับ ('+s.items.length+' ข้อ)</a>';
 var oi=ORDER.indexOf(s.id);if(oi>=0&&oi<ORDER.length-1){var nx=SM[ORDER[oi+1]];h+='<a class="next" href="#/s/'+nx.id+'">ฐานถัดไป: '+esc(nx.t)+' →</a>';}
 app.innerHTML=h;
 bindHead();}

/* ---- recall ---- */
function vRecall(s){var h=head(s,'recall');var m=P.sp[s.id]||{};
 if(!R||R.sid!==s.id){var miss=s.items.filter(function(x){return m[x.i]===0;}).length,todo=s.items.filter(function(x){return m[x.i]===undefined;}).length;
  h+='<div class="card"><div class="qbig">Recall ลำดับขั้นตอน</div><div class="small">ระบบจะโชว์หัวข้อ + คำใบ้ทีละข้อ ให้นึก/พูดออกเสียงก่อน แล้วกด <b>Space</b> เปิดดู จากนั้นให้คะแนนตัวเอง <b>1</b> = นึกไม่ออก · <b>2</b> = นึกออก</div>'+
   '<button class="btn" id="rAll">เริ่มทั้งหมด ('+s.items.length+' ข้อ)</button>'+
   (miss?'<button class="btn ghost" id="rMiss">เฉพาะข้อที่พลาด ('+miss+')</button>':'')+
   (todo&&todo<s.items.length?'<button class="btn ghost" id="rTodo">เฉพาะข้อที่ยังไม่ทำ ('+todo+')</button>':'')+'</div>';
  app.innerHTML=h;bindHead();
  document.getElementById('rAll').onclick=function(){startRecall(s,s.items.map(function(x){return x.i;}));};
  var a=document.getElementById('rMiss');if(a)a.onclick=function(){startRecall(s,s.items.filter(function(x){return m[x.i]===0;}).map(function(x){return x.i;}));};
  var b=document.getElementById('rTodo');if(b)b.onclick=function(){startRecall(s,s.items.filter(function(x){return m[x.i]===undefined;}).map(function(x){return x.i;}));};
  return;}
 var dots='<div class="dots">'+R.list.map(function(ix,j){var v=R.res[ix];return '<i class="'+(j===R.k?'cur':(v===1?'g':(v===0?'r':'')))+'"></i>';}).join('')+'</div>';
 if(R.k>=R.list.length){var ok=0,miss=[];R.list.forEach(function(ix){if(R.res[ix]===1)ok++;else miss.push(s.items[ix]);});
  var pc=Math.round(100*ok/R.list.length);
  h+=dots+'<div class="card sum"><div class="small">จบรอบ Recall</div><div class="big" style="color:'+(pc>=80?'var(--good)':'var(--warn)')+'">'+ok+'/'+R.list.length+'</div><div class="small">'+pc+'%</div>'+
   (miss.length?'<div class="miss-list"><b style="color:var(--bad)">ข้อที่พลาด</b>'+miss.map(function(x){return '<div><span class="small">'+esc(x.sec)+'</span><br>'+(x.cue?'<span class="cue">'+x.cue+'</span> — ':'')+x.ans+'</div>';}).join('')+'</div>':'<div style="margin-top:8px">ครบทุกข้อ 🎉</div>')+
   (miss.length?'<button class="btn" id="rAgain">ทวนเฉพาะข้อที่พลาด ('+miss.length+')</button>':'')+
   '<button class="btn ghost" id="rNew">เริ่มใหม่ทั้งหมด</button>';
  var oi=ORDER.indexOf(s.id);if(oi>=0&&oi<ORDER.length-1){var nx=SM[ORDER[oi+1]];h+='<a class="btn ghost" href="#/s/'+nx.id+'">ฐานถัดไป: '+esc(nx.t)+' →</a>';}
  h+='</div>';app.innerHTML=h;bindHead();
  var a2=document.getElementById('rAgain');if(a2)a2.onclick=function(){startRecall(s,miss.map(function(x){return x.i;}));};
  document.getElementById('rNew').onclick=function(){R=null;render();};return;}
 var it=s.items[R.list[R.k]];
 var prev=s.items.filter(function(x){return x.sec===it.sec&&x.i<it.i;});
 h+=dots+'<div class="card"><div class="deck">'+(R.k+1)+' / '+R.list.length+' · <span style="color:var(--gold)">'+esc(it.sec)+'</span></div>';
 if(prev.length)h+='<div class="prevs">'+prev.map(function(x){return '<div>'+(x.cue?'<b>'+x.cue+'</b> — ':'')+strip(x.ans).slice(0,70)+(strip(x.ans).length>70?'…':'')+'</div>';}).join('')+'</div>';
 h+='<div class="qbig">'+(it.cue?'<span class="cue">'+it.cue+'</span> → ?':'ข้อถัดไปคืออะไร?')+'</div>';
 if(!R.shown)h+='<div class="hid" id="rev">นึก/พูดออกเสียงก่อน แล้วแตะเพื่อเปิด (Space)</div>';
 else h+='<div class="ans">'+(it.cue?'<b>'+it.cue+'</b> — ':'')+it.ans+'</div><div class="grade"><button class="no" id="g1">✗ นึกไม่ออก (1)</button><button class="ok" id="g2">✓ นึกออก (2)</button></div>';
 h+='<div class="keys">Space = เปิด · 1 = ✗ · 2 = ✓</div></div>';
 app.innerHTML=h;bindHead();
 var rv=document.getElementById('rev');if(rv)rv.onclick=revealR;
 var g1=document.getElementById('g1');if(g1){g1.onclick=function(){gradeR(0);};document.getElementById('g2').onclick=function(){gradeR(1);};}}
function startRecall(s,list){R={sid:s.id,list:list,k:0,shown:false,res:{}};render();}
function revealR(){if(R&&R.k<R.list.length&&!R.shown){R.shown=true;render();}}
function gradeR(v){if(!R||!R.shown)return;var ix=R.list[R.k];P.sp[R.sid]=P.sp[R.sid]||{};P.sp[R.sid][ix]=v;save();R.res[ix]=v;R.k++;R.shown=false;render();}

/* ---- cards engine ---- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function vQA(s){var h=head(s,'qa');
 if(!D||D.key!=='qa:'+s.id){D={key:'qa:'+s.id,list:s.qa.map(function(q,i){return s.id+':'+i;}),k:0,shown:false,res:{}};}
 app.innerHTML=h+'<div id="eng"></div>';bindHead();drawEng();}
function drillPool(){return CARDS.filter(function(c){if(DS.cat!=='all'&&c.cat!==DS.cat)return false;
 if(DS.st==='todo')return P.c[c.id]===undefined;if(DS.st==='wrong')return P.c[c.id]===0;return true;});}
function vDrill(){var h='<div class="top"><a class="back" href="#/">← หน้าแรก</a><h2>🃏 Quick drill</h2></div>';
 if(!D||D.key!=='drill'){var pool=drillPool();
  var cats=['all','proc','hx','adv','pe','lab','num'];
  h+='<div class="card"><div class="small">หมวด</div>'+cats.map(function(c){var n=CARDS.filter(function(x){return c==='all'||x.cat===c;}).length;return '<button class="chip'+(DS.cat===c?' on':'')+'" data-c="'+c+'">'+(c==='all'?'ทั้งหมด':CAT[c])+' '+n+'</button>';}).join('')+
   '<div class="small" style="margin-top:8px">สถานะ</div>'+[['all','ทั้งหมด'],['todo','ยังไม่ทำ'],['wrong','ทำผิด']].map(function(x){return '<button class="chip'+(DS.st===x[0]?' on':'')+'" data-s="'+x[0]+'">'+x[1]+'</button>';}).join('')+
   '<button class="chip'+(DS.sh?' on':'')+'" id="sh">🔀 สุ่มลำดับ</button>'+
   '<button class="btn" id="go"'+(pool.length?'':' disabled')+'>เริ่ม '+pool.length+' ใบ</button></div>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('[data-c]'),function(b){b.onclick=function(){DS.cat=b.getAttribute('data-c');render();};});
  [].forEach.call(app.querySelectorAll('[data-s]'),function(b){b.onclick=function(){DS.st=b.getAttribute('data-s');render();};});
  document.getElementById('sh').onclick=function(){DS.sh=!DS.sh;render();};
  document.getElementById('go').onclick=function(){var ids=pool.map(function(c){return c.id;});if(!ids.length)return;D={key:'drill',list:DS.sh?shuffle(ids):ids,k:0,shown:false,res:{}};render();};
  return;}
 app.innerHTML=h+'<div id="eng"></div>';drawEng();}
function drawEng(){var el=document.getElementById('eng');if(!el||!D)return;
 var dots='<div class="dots">'+D.list.map(function(id,j){var v=D.res[id];return '<i class="'+(j===D.k?'cur':(v===1?'g':(v===0?'r':'')))+'"></i>';}).join('')+'</div>';
 if(D.k>=D.list.length){var ok=0,miss=[];D.list.forEach(function(id){if(D.res[id]===1)ok++;else miss.push(id);});
  var pc=Math.round(100*ok/D.list.length);
  var h=dots+'<div class="card sum"><div class="small">จบชุด</div><div class="big" style="color:'+(pc>=80?'var(--good)':'var(--warn)')+'">'+ok+'/'+D.list.length+'</div><div class="small">'+pc+'%</div>'+
   (miss.length?'<div class="miss-list"><b style="color:var(--bad)">ข้อที่ผิด</b>'+miss.map(function(id){var c=CM[id];return '<div><span class="small">'+esc(c.deck)+'</span><br><b>'+c.q+'</b><br>'+c.a+'</div>';}).join('')+'</div>':'')+
   (miss.length?'<button class="btn" id="dAgain">ทวนเฉพาะข้อที่ผิด ('+miss.length+')</button>':'')+
   '<button class="btn ghost" id="dNew">'+(D.key==='drill'?'ตั้งค่าชุดใหม่':'เริ่มใหม่')+'</button></div>';
  el.innerHTML=h;
  var a=document.getElementById('dAgain');if(a)a.onclick=function(){D={key:D.key,list:miss,k:0,shown:false,res:{}};drawEng();};
  document.getElementById('dNew').onclick=function(){D=null;render();};return;}
 var c=CM[D.list[D.k]];
 var h2=dots+'<div class="card"><div class="deck">'+(D.k+1)+' / '+D.list.length+' · '+(c.sid?'<a href="#/s/'+c.sid+'" style="color:var(--acc)">'+esc(c.deck)+'</a>':esc(c.deck))+(P.c[c.id]===0?' · <span style="color:var(--bad)">เคยผิด</span>':'')+'</div>'+
  '<div class="qbig">'+c.q+'</div>';
 if(!D.shown)h2+='<div class="hid" id="rev">นึกคำตอบก่อน แล้วแตะเพื่อเปิด (Space)</div>';
 else h2+='<div class="ans">'+c.a+'</div><div class="grade"><button class="no" id="g1">✗ ผิด/ไม่ครบ (1)</button><button class="ok" id="g2">✓ ถูก (2)</button></div>';
 h2+='<div class="keys">Space = เปิด · 1 = ✗ · 2 = ✓</div></div>';
 el.innerHTML=h2;
 var rv=document.getElementById('rev');if(rv)rv.onclick=revealD;
 var g1=document.getElementById('g1');if(g1){g1.onclick=function(){gradeD(0);};document.getElementById('g2').onclick=function(){gradeD(1);};}}
function revealD(){if(D&&D.k<D.list.length&&!D.shown){D.shown=true;drawEng();}}
function gradeD(v){if(!D||!D.shown)return;var id=D.list[D.k];P.c[id]=v;save();D.res[id]=v;D.k++;D.shown=false;drawEng();window.scrollTo(0,0);}

/* ---- traps / nums ---- */
function vTraps(){var n=0;for(var k in P.tr)if(P.tr[k])n++;
 var h='<div class="top"><a class="back" href="#/">← หน้าแรก</a><h2>⚠️ กับดักที่เพื่อนเจอจริง</h2></div><div class="small">อ่านวันสุดท้าย ติ๊กเมื่อมั่นใจ ('+n+'/'+TRAPS.length+')</div><div class="panel">'+
  TRAPS.map(function(t,i){return '<div class="tick'+(P.tr[i]?' on':'')+'" data-i="'+i+'"><span class="bx">'+(P.tr[i]?'✓':'')+'</span><span class="tt"><b>'+esc(t[0])+'</b> — '+t[1]+'</span></div>';}).join('')+
  '</div><button class="reset" id="trr">ล้างติ๊ก</button>';
 app.innerHTML=h;
 [].forEach.call(app.querySelectorAll('.tick'),function(el){el.onclick=function(){var i=el.getAttribute('data-i');P.tr[i]=P.tr[i]?0:1;save();vTraps();};});
 document.getElementById('trr').onclick=function(){P.tr={};save();vTraps();};}
function vNums(){var h='<div class="top"><a class="back" href="#/">← หน้าแรก</a><h2>🔢 ตัวเลขต้องจำ</h2></div><div class="panel"><table>'+
  NUMS.map(function(n){return '<tr><td>'+esc(n[0])+'</td><td>'+n[1]+'</td></tr>';}).join('')+'</table></div>'+
  '<button class="btn" id="nd">🃏 ฝึกตัวเลข ('+NUMS.length+' ใบ)</button>';
 app.innerHTML=h;
 document.getElementById('nd').onclick=function(){DS={cat:'num',st:'all',sh:true};var ids=CARDS.filter(function(c){return c.cat==='num';}).map(function(c){return c.id;});D={key:'drill',list:shuffle(ids),k:0,shown:false,res:{}};go('/drill');};}

/* ---- 5-min timer ---- */
var T={end:0,iv:null,warned:false},actx=null;
var pill=document.getElementById('tpill');
function beep(n){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime;
 for(var i=0;i<n;i++){var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,t+i*0.4);g.gain.exponentialRampToValueAtTime(0.3,t+i*0.4+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.4+0.3);o.start(t+i*0.4);o.stop(t+i*0.4+0.32);}}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate(n>1?[200,100,200,100,200]:200);}catch(e){}}
function startTimer(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
 T.end=Date.now()+300000;T.warned=false;if(T.iv)clearInterval(T.iv);T.iv=setInterval(tick,250);tick();}
function stopTimer(){if(T.iv)clearInterval(T.iv);T.iv=null;pill.style.display='none';}
function tick(){var rem=T.end-Date.now();pill.style.display='block';
 if(rem<=0){pill.className='over';pill.innerHTML='หมดเวลา<small>แตะเพื่อปิด</small>';clearInterval(T.iv);T.iv=null;beep(3);return;}
 var s=Math.ceil(rem/1000),m=Math.floor(s/60);s=s%60;
 if(rem<=60000&&!T.warned){T.warned=true;beep(1);}
 pill.className=rem<=60000?'warn':'';pill.innerHTML='⏱ '+m+':'+(s<10?'0':'')+s+'<small>แตะเพื่อหยุด</small>';}
pill.onclick=stopTimer;

/* ---- keys ---- */
document.addEventListener('keydown',function(e){var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
 var r=route();var k=e.key;
 if(r[0]==='s'&&r[2]==='recall'&&R&&R.sid===r[1]&&R.k<R.list.length){
  if(k===' '||k==='Enter'){e.preventDefault();if(!R.shown)revealR();return;}
  if(R.shown&&(k==='1'||k==='2')){e.preventDefault();gradeR(k==='2'?1:0);}return;}
 if(D&&document.getElementById('eng')&&D.k<D.list.length){
  if(k===' '||k==='Enter'){e.preventDefault();if(!D.shown)revealD();return;}
  if(D.shown&&(k==='1'||k==='2')){e.preventDefault();gradeD(k==='2'?1:0);}}});

render();
window.__osce={P:P,S:S,CARDS:CARDS,go:go,render:render,getR:function(){return R;},getD:function(){return D;},startTimer:startTimer,stopTimer:stopTimer};
})();
</script>
